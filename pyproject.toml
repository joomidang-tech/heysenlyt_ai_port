[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "port-heysenlyt-ai"
version = "1.4.0"
description = "heysenlyt ↔ SENSORIUM 계약(포트) — 의존성 0"
requires-python = ">=3.11"
dependencies = []  # ⛔ 영원히 비어 있어야 한다 — 계약에 무거운 코드가 딸려가지 않는 것이 존재 이유

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["heysenlyt_ai_port*"]
